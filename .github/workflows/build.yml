name: Build NightmareItems
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build plugin
        run: gradle --no-daemon clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NightmareItems
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
